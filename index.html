<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Plateau Monopoly Moderne</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkfF6mt0eaaTDLXuHwZ1Q9apORdzdrIW6DCrA44vNXxjH1z1cZ8YdJQ3g==" crossorigin="anonymous" referrerpolicy="no-referrer"/>
    <style>
        :root {
            --brown: #955436;
            --light-blue: #9ad5f2;
            --pink: #f19ac3;
            --orange: #f5a05f;
            --red: #e63946;
            --yellow: #f9ed69;
            --green: #2a9d8f;
            --dark-blue: #0d47a1;
            --violet: #9c5ce0;
            --board-bg: #f9fafb;
            --ink: #1f2933;
            --muted: #6c7a89;
        }
        * {
            box-sizing: border-box;
        }
        body {
            margin: 0;
            min-height: 100vh;
            font-family: 'Poppins', sans-serif;
            color: var(--ink);
            background: radial-gradient(circle at top left, #fdf2f8, #dbeafe 40%, #c7d2fe 80%);
        }
        .page-wrap {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 3rem 1rem;
        }
        .board-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        .board {
            width: min(60vw, 60vh);
            height: min(60vw, 60vh);
            background: var(--board-bg);
            border: 14px solid #111;
            border-radius: 30px;
            box-shadow: 0 30px 60px rgba(15, 23, 42, 0.2);
            display: grid;
            grid-template-columns: repeat(11, 1fr);
            grid-template-rows: repeat(11, 1fr);
            position: relative;
            overflow: hidden;
        }
        .board::before {
            content: "";
            position: absolute;
            inset: 16px;
            border: 3px dashed rgba(17, 17, 17, 0.08);
            border-radius: 22px;
            pointer-events: none;
        }
        .center {
            grid-column: 2 / 11;
            grid-row: 2 / 11;
            background: linear-gradient(140deg, rgba(13, 71, 161, 0.08), rgba(42, 157, 143, 0.08));
            border-radius: 20px;
            display: grid;
            place-items: center;
            text-align: center;
            padding: 1.5rem;
        }
        .center-logo {
            border: 6px solid #111;
            border-radius: 18px;
            background: linear-gradient(120deg, #ef4444, #f97316);
            color: #fff;
            padding: 2rem 1.5rem;
            display: inline-flex;
            flex-direction: column;
            gap: .5rem;
            box-shadow: inset 0 0 0 6px rgba(255,255,255,.18), 0 18px 30px rgba(239, 68, 68, 0.25);
        }
        .center-logo span {
            font-size: 1rem;
            letter-spacing: .5rem;
        }
        .center-logo strong {
            font-size: clamp(1.6rem, 3vw, 2.6rem);
            text-transform: uppercase;
            letter-spacing: .6rem;
        }
        .square {
            border: 1px solid rgba(17, 17, 17, 0.12);
            background: rgba(255,255,255,0.88);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            text-align: center;
            position: relative;
            transition: transform .2s ease, box-shadow .2s ease, background .2s ease;
        }
        .square .inner {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            width: 100%;
            height: 100%;
            padding: 2px;
        }
        .square .label {
            font-size: clamp(0.42rem, 1.2vw, 0.7rem);
            font-weight: 600;
            line-height: 1.1;
        }
        .square .price {
            font-size: clamp(0.4rem, 1vw, 0.6rem);
            color: var(--muted);
        }
        .square .color-bar {
            width: 100%;
            height: 18%;
            border-radius: 4px;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.2);
        }
        .square .icon {
            font-size: clamp(0.6rem, 1.4vw, 0.95rem);
            color: #111;
        }
        .square.corner {
            background: radial-gradient(circle at center, rgba(255,255,255,0.95), rgba(255,255,255,0.8));
            font-size: clamp(0.6rem, 1.2vw, 0.9rem);
            font-weight: 700;
            text-transform: uppercase;
            gap: .25rem;
        }
        .square.corner .inner {
            gap: .2rem;
        }
        .square.corner i {
            font-size: clamp(1.2rem, 2vw, 1.8rem);
            color: #111;
        }
        .square:hover {
            cursor: pointer;
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(15, 23, 42, 0.22);
            background: rgba(255,255,255,0.95);
        }
        .square.active {
            box-shadow: inset 0 0 0 3px #facc15, 0 12px 22px rgba(251, 191, 36, 0.4);
            background: rgba(255, 247, 179, 0.92);
        }
        .square.bottom .inner {}
        .square.left .inner { transform: rotate(90deg); }
        .square.top .inner { transform: rotate(180deg); }
        .square.right .inner { transform: rotate(-90deg); }
        .square.corner.bottom-left .inner { transform: rotate(90deg); }
        .square.corner.top-left .inner { transform: rotate(180deg); }
        .square.corner.top-right .inner { transform: rotate(-90deg); }
        .square.corner.bottom-right .inner { transform: rotate(0deg); }

        @media (max-width: 992px) {
            .board {
                width: min(88vw, 88vh);
                height: min(88vw, 88vh);
            }
        }
        @media (max-width: 768px) {
            .panel {
                margin-top: 2rem;
            }
        }
        .info-card {
            background: rgba(255, 255, 255, 0.82);
            backdrop-filter: blur(8px);
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.6);
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.18);
        }
        .timeline {
            max-height: 220px;
            overflow-y: auto;
        }
        .timeline::-webkit-scrollbar {
            width: 6px;
        }
        .timeline::-webkit-scrollbar-thumb {
            background: rgba(17,17,17,0.2);
            border-radius: 99px;
        }
        .btn-monopoly {
            border-radius: 999px;
            font-weight: 600;
            padding: 0.75rem 1.6rem;
        }
        .group-pill {
            display: inline-flex;
            align-items: center;
            gap: .5rem;
            padding: .35rem .8rem;
            border-radius: 999px;
            font-weight: 600;
        }
        .dice {
            display: flex;
            align-items: center;
            gap: 1rem;
            font-size: 2rem;
        }
        .dice i {
            color: #111;
        }
    </style>
</head>
<body>
    <div class="page-wrap">
        <div class="container-xl">
            <div class="row g-4 align-items-center justify-content-center">
                <div class="col-12 col-lg-7 d-flex justify-content-center">
                    <div class="board-wrapper">
                        <div id="board" class="board">
                            <div class="center">
                                <div class="center-logo">
                                    <span>ÉDITION FR</span>
                                    <strong>MONOPOLY</strong>
                                    <span>DELUXE</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-12 col-lg-5">
                    <div class="info-card p-4">
                        <div class="d-flex justify-content-between align-items-center mb-3">
                            <div>
                                <h1 class="h4 mb-0">Contrôle du plateau</h1>
                                <p class="text-secondary mb-0">Clique sur une case ou lance les dés pour explorer.</p>
                            </div>
                            <div class="dice" id="dice">
                                <i class="fa-solid fa-dice-one" id="diceOne"></i>
                                <i class="fa-solid fa-dice-one" id="diceTwo"></i>
                            </div>
                        </div>
                        <div class="d-flex gap-2 mb-3">
                            <button class="btn btn-danger btn-monopoly" id="rollBtn"><i class="fa-solid fa-dice me-2"></i>Lancer les dés</button>
                            <button class="btn btn-outline-dark btn-monopoly" id="resetBtn"><i class="fa-solid fa-rotate-left me-2"></i>Réinitialiser</button>
                        </div>
                        <div class="border-top pt-3 mt-3">
                            <span class="text-uppercase fw-semibold small text-secondary">Case active</span>
                            <h2 class="h4 mt-1" id="propertyTitle">Départ</h2>
                            <div id="groupBadge" class="group-pill bg-warning-subtle text-warning-emphasis mb-2">
                                <i class="fa-solid fa-flag-checkered"></i>
                                Départ
                            </div>
                            <p class="mb-0 text-secondary" id="propertyDescription">Touchez 200 ₣ lorsque vous passez par la case Départ. Bon jeu !</p>
                        </div>
                        <div class="border-top pt-3 mt-4">
                            <span class="text-uppercase fw-semibold small text-secondary">Journal</span>
                            <div class="timeline" id="log"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script>
        const squares = [
            { name: 'Départ', type: 'corner', icon: 'fa-flag-checkered', info: 'Touchez 200 ₣ lorsque vous passez par la case Départ. Bon jeu !', color: '#facc15' },
            { name: 'Boulevard de Belleville', type: 'property', group: 'brown', price: '60 ₣', info: 'Loyer nu : 2 ₣\nLoyer complet : 50 ₣', color: '--brown' },
            { name: 'Caisse de communauté', type: 'community', icon: 'fa-gift', info: 'Piochez une carte Caisse de communauté.', color: '#38bdf8' },
            { name: 'Rue Lecourbe', type: 'property', group: 'brown', price: '60 ₣', info: 'Loyer nu : 4 ₣\nLoyer complet : 60 ₣', color: '--brown' },
            { name: 'Impôts sur le revenu', type: 'tax', icon: 'fa-sack-dollar', info: 'Payez 200 ₣ au Trésor.', color: '#e11d48' },
            { name: 'Gare Montparnasse', type: 'station', icon: 'fa-train-subway', price: '200 ₣', info: 'Loyer x nombre de gares possédées.', color: '#475569' },
            { name: 'Rue de Vaugirard', type: 'property', group: 'light-blue', price: '100 ₣', info: 'Loyer nu : 6 ₣\nLoyer complet : 90 ₣', color: '--light-blue' },
            { name: 'Chance', type: 'chance', icon: 'fa-shuffle', info: 'Piochez une carte Chance.', color: '#fb923c' },
            { name: 'Rue de Courcelles', type: 'property', group: 'light-blue', price: '100 ₣', info: 'Loyer nu : 6 ₣\nLoyer complet : 90 ₣', color: '--light-blue' },
            { name: 'Avenue de la République', type: 'property', group: 'light-blue', price: '120 ₣', info: 'Loyer nu : 8 ₣\nLoyer complet : 100 ₣', color: '--light-blue' },
            { name: 'Simple visite', type: 'corner', icon: 'fa-person-booth', info: 'En visite au poste de police. Vous êtes simplement de passage.', color: '#38bdf8' },
            { name: 'Boulevard de la Villette', type: 'property', group: 'pink', price: '140 ₣', info: 'Loyer nu : 10 ₣\nLoyer complet : 140 ₣', color: '--pink' },
            { name: 'Compagnie des eaux', type: 'utility', icon: 'fa-faucet', price: '150 ₣', info: 'Payez 4x le total des dés (10x si deux compagnies).', color: '#14b8a6' },
            { name: 'Avenue de Neuilly', type: 'property', group: 'pink', price: '140 ₣', info: 'Loyer nu : 10 ₣\nLoyer complet : 140 ₣', color: '--pink' },
            { name: 'Rue de Paradis', type: 'property', group: 'pink', price: '160 ₣', info: 'Loyer nu : 12 ₣\nLoyer complet : 160 ₣', color: '--pink' },
            { name: 'Gare de Lyon', type: 'station', icon: 'fa-train-subway', price: '200 ₣', info: 'Loyer x nombre de gares possédées.', color: '#475569' },
            { name: 'Avenue Mozart', type: 'property', group: 'orange', price: '180 ₣', info: 'Loyer nu : 14 ₣\nLoyer complet : 180 ₣', color: '--orange' },
            { name: 'Caisse de communauté', type: 'community', icon: 'fa-gift', info: 'Piochez une carte Caisse de communauté.', color: '#38bdf8' },
            { name: 'Boulevard Saint-Michel', type: 'property', group: 'orange', price: '180 ₣', info: 'Loyer nu : 14 ₣\nLoyer complet : 180 ₣', color: '--orange' },
            { name: 'Place Pigalle', type: 'property', group: 'orange', price: '200 ₣', info: 'Loyer nu : 16 ₣\nLoyer complet : 200 ₣', color: '--orange' },
            { name: 'Parc Gratuit', type: 'corner', icon: 'fa-tree-city', info: 'Profitez du parc et respirez un peu !', color: '#22c55e' },
            { name: 'Avenue Matignon', type: 'property', group: 'red', price: '220 ₣', info: 'Loyer nu : 18 ₣\nLoyer complet : 220 ₣', color: '--red' },
            { name: 'Chance', type: 'chance', icon: 'fa-shuffle', info: 'Piochez une carte Chance.', color: '#fb923c' },
            { name: 'Boulevard Malesherbes', type: 'property', group: 'red', price: '220 ₣', info: 'Loyer nu : 18 ₣\nLoyer complet : 220 ₣', color: '--red' },
            { name: 'Avenue Henri-Martin', type: 'property', group: 'red', price: '240 ₣', info: 'Loyer nu : 20 ₣\nLoyer complet : 240 ₣', color: '--red' },
            { name: 'Gare du Nord', type: 'station', icon: 'fa-train-subway', price: '200 ₣', info: 'Loyer x nombre de gares possédées.', color: '#475569' },
            { name: 'Faubourg Saint-Honoré', type: 'property', group: 'yellow', price: '260 ₣', info: 'Loyer nu : 22 ₣\nLoyer complet : 260 ₣', color: '--yellow' },
            { name: 'Place de la Bourse', type: 'property', group: 'yellow', price: '260 ₣', info: 'Loyer nu : 22 ₣\nLoyer complet : 260 ₣', color: '--yellow' },
            { name: "Compagnie d'électricité", type: 'utility', icon: 'fa-bolt', price: '150 ₣', info: 'Payez 4x le total des dés (10x si deux compagnies).', color: '#14b8a6' },
            { name: 'Rue La Fayette', type: 'property', group: 'yellow', price: '280 ₣', info: 'Loyer nu : 24 ₣\nLoyer complet : 280 ₣', color: '--yellow' },
            { name: 'Allez en prison', type: 'corner', icon: 'fa-gavel', info: 'Direction la prison ! Déplacez votre pion immédiatement.', color: '#ef4444' },
            { name: 'Avenue de Breteuil', type: 'property', group: 'green', price: '300 ₣', info: 'Loyer nu : 26 ₣\nLoyer complet : 300 ₣', color: '--green' },
            { name: 'Avenue Foch', type: 'property', group: 'green', price: '300 ₣', info: 'Loyer nu : 26 ₣\nLoyer complet : 300 ₣', color: '--green' },
            { name: 'Caisse de communauté', type: 'community', icon: 'fa-gift', info: 'Piochez une carte Caisse de communauté.', color: '#38bdf8' },
            { name: 'Boulevard des Capucines', type: 'property', group: 'green', price: '320 ₣', info: 'Loyer nu : 28 ₣\nLoyer complet : 320 ₣', color: '--green' },
            { name: 'Gare Saint-Lazare', type: 'station', icon: 'fa-train-subway', price: '200 ₣', info: 'Loyer x nombre de gares possédées.', color: '#475569' },
            { name: 'Chance', type: 'chance', icon: 'fa-shuffle', info: 'Piochez une carte Chance.', color: '#fb923c' },
            { name: 'Avenue des Champs-Élysées', type: 'property', group: 'dark-blue', price: '350 ₣', info: 'Loyer nu : 35 ₣\nLoyer complet : 400 ₣', color: '--dark-blue' },
            { name: 'Taxe de luxe', type: 'tax', icon: 'fa-gem', info: 'Payez 100 ₣ de taxe de luxe.', color: '#a855f7' },
            { name: 'Rue de la Paix', type: 'property', group: 'dark-blue', price: '400 ₣', info: 'Loyer nu : 50 ₣\nLoyer complet : 500 ₣', color: '--dark-blue' }
        ];

        const board = document.getElementById('board');
        const logEl = document.getElementById('log');
        const titleEl = document.getElementById('propertyTitle');
        const descEl = document.getElementById('propertyDescription');
        const badgeEl = document.getElementById('groupBadge');
        const rollBtn = document.getElementById('rollBtn');
        const resetBtn = document.getElementById('resetBtn');
        const diceOne = document.getElementById('diceOne');
        const diceTwo = document.getElementById('diceTwo');

        const diceClasses = {
            1: 'fa-dice-one',
            2: 'fa-dice-two',
            3: 'fa-dice-three',
            4: 'fa-dice-four',
            5: 'fa-dice-five',
            6: 'fa-dice-six'
        };

        let activeIndex = 0;

        function positionFor(index) {
            if (index <= 10) {
                return { row: 11, col: 11 - index };
            }
            if (index <= 20) {
                return { row: 11 - (index - 10), col: 1 };
            }
            if (index <= 30) {
                return { row: 1, col: 1 + (index - 20) };
            }
            return { row: 1 + (index - 30), col: 11 };
        }

        function edgeFor(index) {
            if (index === 0) return 'corner bottom-right';
            if (index === 10) return 'corner bottom-left';
            if (index === 20) return 'corner top-left';
            if (index === 30) return 'corner top-right';
            if (index < 10) return 'bottom';
            if (index < 20) return 'left';
            if (index < 30) return 'top';
            return 'right';
        }

        function renderSquares() {
            squares.forEach((sq, index) => {
                const square = document.createElement('div');
                const pos = positionFor(index);
                square.style.gridColumn = pos.col;
                square.style.gridRow = pos.row;
                square.className = `square ${edgeFor(index)} ${sq.type}`;
                square.dataset.index = index;
                square.dataset.name = sq.name;
                square.dataset.info = sq.info;
                square.dataset.type = sq.type;
                if (sq.group) {
                    square.dataset.group = sq.group;
                }
                if (sq.price) {
                    square.dataset.price = sq.price;
                }
                const inner = document.createElement('div');
                inner.className = 'inner';
                if (sq.type === 'property') {
                    const colorValue = sq.color
                        ? (sq.color.startsWith('--')
                            ? getComputedStyle(document.documentElement).getPropertyValue(sq.color).trim()
                            : sq.color)
                        : '';
                    const color = colorValue || '#ddd';
                    const bar = document.createElement('div');
                    bar.className = 'color-bar';
                    bar.style.background = color;
                    inner.appendChild(bar);
                    const label = document.createElement('div');
                    label.className = 'label';
                    label.textContent = sq.name;
                    inner.appendChild(label);
                    const price = document.createElement('div');
                    price.className = 'price';
                    price.textContent = sq.price;
                    inner.appendChild(price);
                } else {
                    const icon = document.createElement('i');
                    icon.className = `icon fa-solid ${sq.icon || 'fa-circle'}`;
                    inner.appendChild(icon);
                    const label = document.createElement('div');
                    label.className = 'label';
                    label.textContent = sq.name;
                    inner.appendChild(label);
                    if (sq.price) {
                        const price = document.createElement('div');
                        price.className = 'price';
                        price.textContent = sq.price;
                        inner.appendChild(price);
                    }
                }
                square.appendChild(inner);
                square.addEventListener('click', () => {
                    setActive(index);
                    pushLog(`Inspection de <strong>${sq.name}</strong>.`);
                });
                board.appendChild(square);
            });
        }

        function setActive(index) {
            const previous = board.querySelector('.square.active');
            if (previous) {
                previous.classList.remove('active');
            }
            const square = board.querySelector(`.square[data-index="${index}"]`);
            if (square) {
                square.classList.add('active');
                activeIndex = index;
                updatePanel(square.dataset);
            }
        }

        function updatePanel(data) {
            titleEl.textContent = data.name;
            descEl.textContent = data.info;
            let badgeContent = '';
            let badgeColor = 'bg-secondary-subtle text-secondary-emphasis';
            let iconClass = 'fa-map-pin';
            switch (data.type) {
                case 'property':
                    badgeColor = 'bg-dark text-white';
                    iconClass = 'fa-house';
                    badgeContent = `${data.group ? data.group.replace('-', ' ') : 'Propriété'} · ${data.price || ''}`;
                    break;
                case 'station':
                    badgeColor = 'bg-primary-subtle text-primary-emphasis';
                    iconClass = 'fa-train';
                    badgeContent = `Gare · ${data.price || ''}`;
                    break;
                case 'utility':
                    badgeColor = 'bg-info-subtle text-info-emphasis';
                    iconClass = 'fa-plug';
                    badgeContent = `Compagnie · ${data.price || ''}`;
                    break;
                case 'chance':
                    badgeColor = 'bg-warning-subtle text-warning-emphasis';
                    iconClass = 'fa-question';
                    badgeContent = 'Chance';
                    break;
                case 'community':
                    badgeColor = 'bg-success-subtle text-success-emphasis';
                    iconClass = 'fa-gift';
                    badgeContent = 'Caisse de communauté';
                    break;
                case 'tax':
                    badgeColor = 'bg-danger-subtle text-danger-emphasis';
                    iconClass = 'fa-coins';
                    badgeContent = 'Taxe';
                    break;
                default:
                    badgeColor = 'bg-warning-subtle text-warning-emphasis';
                    iconClass = 'fa-flag-checkered';
                    badgeContent = data.name;
            }
            badgeEl.className = `group-pill ${badgeColor}`;
            badgeEl.innerHTML = `<i class="fa-solid ${iconClass}"></i><span>${badgeContent}</span>`;
        }

        function pushLog(message) {
            const time = new Date().toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
            const entry = document.createElement('div');
            entry.className = 'mb-2 small';
            entry.innerHTML = `<span class="text-muted me-2">${time}</span>${message}`;
            logEl.prepend(entry);
            const items = logEl.querySelectorAll('.mb-2');
            if (items.length > 12) {
                logEl.removeChild(logEl.lastChild);
            }
        }

        function rollDice() {
            const d1 = Math.floor(Math.random() * 6) + 1;
            const d2 = Math.floor(Math.random() * 6) + 1;
            updateDiceDisplay(d1, d2);
            const total = d1 + d2;
            const nextIndex = (activeIndex + total) % squares.length;
            setActive(nextIndex);
            pushLog(`Lancer de dés : <strong>${d1}</strong> + <strong>${d2}</strong> = <strong>${total}</strong>.`);
        }

        function updateDiceDisplay(d1, d2) {
            diceOne.className = `fa-solid ${diceClasses[d1]}`;
            diceTwo.className = `fa-solid ${diceClasses[d2]}`;
        }

        function resetBoard() {
            setActive(0);
            updateDiceDisplay(1, 1);
            pushLog('Réinitialisation du pion au départ.');
        }

        rollBtn.addEventListener('click', rollDice);
        resetBtn.addEventListener('click', resetBoard);

        renderSquares();
        setActive(0);
        pushLog('Bienvenue sur le plateau Monopoly Deluxe !');
    </script>
</body>
</html>
